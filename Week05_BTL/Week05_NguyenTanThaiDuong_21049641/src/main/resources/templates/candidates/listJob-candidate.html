<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Listings</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/9631/9631363.png" type="image/x-icon">

    <style>
        .pagination a {
            text-decoration: none;
            color: black;
            padding: 8px 12px;
            margin: 2px;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .pagination a.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }

        .pagination a:hover {
            background-color: #f0f0f0;
        }

        .table th, .table td {
            vertical-align: middle;
            text-align: center;
        }

        .btn-custom {
            text-decoration: none;
            color: white;
        }

        .btn-custom:hover {
            text-decoration: none;
            color: white;
        }
    </style>
</head>
<body>
<div class="container my-5">
    <h1 class="text-center mb-4"><a style="text-decoration: none;color: #000" href="/jobs/list-job">JOB LISTING</a></h1>

    <!-- Back to Home and Search Bar -->
    <div class="row mb-3">
        <div class="col-md-3">
            <a href="/candidate/recommendations" class="btn btn-primary w-100">Back</a>
        </div>
        <div class="col-md-9">
            <form method="get" th:action="@{/jobs/searchJobByJobName}" class="d-flex">
                <input type="text" name="jobName" class="form-control me-2" placeholder="Search by job name">
                <button type="submit" class="btn btn-info">Search</button>
            </form>
        </div>
    </div>

    <!-- Jobs Table -->
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Job Name</th>
            <th>Description</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="job : ${jobPage.content}">
            <td th:text="${job.id}"></td>
            <td th:text="${job.jobName}"></td>
            <td th:text="${job.jobDesc}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(jobPage.content)}">
            <td colspan="3" class="text-center text-muted">No jobs found.</td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <div class="d-flex justify-content-center mt-3" th:if="${jobPage.totalPages > 1}">
        <div class="pagination">
            <a th:each="pageNumber : ${pageNumbers}"
               th:href="@{/jobs/list-job(size=${jobPage.size}, page=${pageNumber})}"
               th:class="${pageNumber == jobPage.number + 1} ? 'active' : ''"
               th:text="${pageNumber}"></a>
        </div>
    </div>
</div>
</body>
</html>
