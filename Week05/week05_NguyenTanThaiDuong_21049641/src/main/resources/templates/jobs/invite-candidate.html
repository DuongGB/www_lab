<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Invite Candidates</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/9631/9631363.png" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f0f4f8, #dfe7ed);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #495057;
    }
    h2, h3 {
      color: #343a40;
      margin-bottom: 20px;
    }
    .container {
      max-width: 1100px;
      background: #ffffff;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .table th, .table td {
      vertical-align: middle;
    }
    .btn-primary {
      border-radius: 20px;
    }
    .btn-secondary {
      margin-top: 20px;
    }
    .alert-info {
      background-color: #e9f5fc;
      border: 1px solid #b8d4e6;
      color: #31708f;
    }
    ul {
      padding-left: 20px;
      margin-bottom: 0;
    }
    ul li {
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
<div class="container mt-5">
  <h2>Invite Candidates for Job: <span th:text="${job.getJobName()}">Job Name</span></h2>
  <p><strong>Description:</strong> <span th:text="${job.getJobDesc()}">Job Description</span></p>

  <div th:if="${!#lists.isEmpty(candidates)}">
    <h3>Suitable Candidates</h3>
    <table class="table table-hover mt-3 table-bordered">
      <thead class="table-dark">
      <tr>
        <th>Candidate Name</th>
        <th>Email</th>
        <th>Skills</th>
        <th>Action</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="candidate : ${candidates}">
        <td th:text="${candidate.getFullName()}">John Doe</td>
        <td th:text="${candidate.getEmail()}">johndoe@example.com</td>
        <td>
          <ul>
            <li th:each="skill : ${candidate.candidateSkills}" th:text="${skill.getSkill().getSkillName()}">Skill Name</li>
          </ul>
        </td>
        <td>
          <form th:action="@{'/jobs/' + ${job.getId()} + '/inviteCandidate/' + ${candidate.getId()}}" method="post">
            <button type="submit" class="btn btn-primary">Invite</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div th:if="${#lists.isEmpty(candidates)}" class="alert alert-info mt-4">
    No suitable candidates found for this job.
  </div>

  <a th:href="@{/jobs}" class="btn btn-secondary">Back to Job Listings</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
