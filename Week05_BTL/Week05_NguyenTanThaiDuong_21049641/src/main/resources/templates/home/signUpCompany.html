<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Company Registration</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/9631/9631363.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #F3F8FF;
            font-family: Arial, Helvetica, sans-serif;
        }

        .form-wrapper {
            background: #FFFFFF;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 3rem auto;
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header h1 {
            font-size: 2rem;
            color: #333;
        }

        .form-header p {
            color: #555;
            font-size: 0.9rem;
        }

        .btn-custom {
            background-color: #4A90E2;
            border-color: #4A90E2;
            color: white;
        }

        .btn-custom:hover {
            background-color: #3B7CC7;
            border-color: #3B7CC7;
        }

        .alert {
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .form-group label {
            font-weight: 500;
        }

        .back-button {
            display: flex;
            align-items: center;
            margin-top: 1rem;
            color: #4A90E2;
        }

        .back-button i {
            margin-right: 0.5rem;
        }

        .form-control:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

    </style>
</head>
<body>
<div class="container">
    <div class="form-wrapper">
        <div class="form-header">
            <h1>Register Your Company</h1>
            <p>Provide accurate details to set up your company profile.</p>
        </div>

        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/company/signUpCompany}" th:object="${company}" method="post">

            <div class="form-group mb-3">
                <label for="compName">Company Name</label>
                <input type="text" class="form-control" id="compName" th:field="*{compName}" required>
            </div>

            <div class="form-group mb-3">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" required>
            </div>

            <div class="form-group mb-3">
                <label for="phone">Phone</label>
                <input type="tel" class="form-control" id="phone" th:field="*{phone}" required>
            </div>

            <div class="form-group mb-3">
                <label for="about">About</label>
                <textarea class="form-control" id="about" th:field="*{about}" rows="4"></textarea>
            </div>

            <div class="form-group mb-3">
                <label for="webUrl">Website URL</label>
                <input type="url" class="form-control" id="webUrl" th:field="*{webUrl}">
            </div>

            <h3 class="mb-3">Address Details</h3>

            <div class="form-group mb-3">
                <label for="street">Street</label>
                <input type="text" class="form-control" id="street" th:field="*{address.street}" required>
            </div>

            <div class="form-group mb-3">
                <label for="city">City</label>
                <input type="text" class="form-control" id="city" th:field="*{address.city}" required>
            </div>

            <div class="form-group mb-3">
                <label for="country">Country</label>
                <select class="form-select" id="country" th:field="*{address.country}" required>
                    <option value="" disabled selected>Select a country</option>
                    <option th:each="country : ${countries}" th:value="${country}" th:text="${country.name}"></option>
                </select>
            </div>

            <div class="form-group mb-3">
                <label for="number">Number</label>
                <input type="text" class="form-control" id="number" th:field="*{address.number}" required>
            </div>

            <div class="form-group mb-3">
                <label for="zipcode">Zip Code</label>
                <input type="text" class="form-control" id="zipcode" th:field="*{address.zipcode}" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-custom">Register</button>
            </div>

        </form>

        <a href="/" class="back-button">
            <i class="bi bi-arrow-left"></i> Back to Homepage
        </a>
    </div>
</div>
</body>
</html>
