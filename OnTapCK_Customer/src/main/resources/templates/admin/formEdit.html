<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FORM EDIT</title>
</head>
<body>
<body>
<div>
  <h1>EDIT CUSTOMER</h1>
  <div th:if="${error}">
    <span  th:text="${error}"></span>
  </div>
  <form method="post" th:action="@{/admin/formEdit}" th:object="${customer}">
    <input type="hidden" name="_method" value="put"/>
    <input type="hidden" th:field="*{id}" />
    <label for="name">Name:</label>
    <input type="text" name="name" id="name" th:field="*{custName}"/>
    <br>
    <label for="dob">DOB:</label>
    <input type="date" name="dob" id="dob" th:field="*{custDob}"/>
    <br>
    <label for="email">Email:</label>
    <input type="email" name="email" id="email" th:field="*{custEmail}"/>
    <br>
    <label for="address">Address:</label>
    <input type="text" name="address" id="address" th:field="*{custAddress}"/>
    <button type="submit">Edit</button>
  </form>
</div>
</body>
</html>
