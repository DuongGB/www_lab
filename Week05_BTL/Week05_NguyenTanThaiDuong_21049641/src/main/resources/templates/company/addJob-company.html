<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/9631/9631363.png" type="image/x-icon">
    <title>Create Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #e0f7fa;
            font-family: 'Roboto', sans-serif;
            color: #00796b;
        }

        .header {
            background-color: #00796b;
            color: white;
            padding: 25px 0;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        .container {
            max-width: 900px;
            margin-top: 40px;
        }

        .card {
            border-radius: 20px;
            background: #ffffff;
            padding: 30px;
            box-shadow: 0 6px 12px rgba(0, 121, 107, 0.1);
        }

        .form-control,
        .form-select {
            border-radius: 8px;
            border: 1px solid #00796b;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #004d40;
            box-shadow: 0 0 8px rgba(0, 121, 107, 0.5);
        }

        .form-label {
            font-weight: 600;
        }

        .instructions {
            font-size: 0.875rem;
            color: #004d40;
        }

        .btn {
            border-radius: 30px;
        }

        .btn-primary {
            background-color: #00796b;
            border: none;
            color: white;
        }

        .btn-primary:hover {
            background-color: #004d40;
        }

        .btn-outline-primary {
            border: 2px solid #00796b;
            color: #00796b;
        }

        .btn-outline-primary:hover {
            background-color: #00796b;
            color: white;
        }

        .new-skill-entry {
            padding: 20px;
            margin-bottom: 15px;
            border: 2px dashed #00796b;
            border-radius: 10px;
            background: #e0f2f1;
        }

        .remove-skill {
            background: none;
            border: none;
            color: #f44336;
            font-weight: bold;
        }

        .remove-skill:hover {
            cursor: pointer;
        }
    </style>
</head>

<body>
<div class="header text-center">
    <h1>CREATE NEW JOB</h1>
</div>

<div class="container">
    <div class="card shadow">
        <form th:action="@{/company/saveJob}" th:object="${job}" method="post">
            <!-- Job Name -->
            <div class="mb-4">
                <label for="jobName" class="form-label">Job Name</label>
                <input type="text" id="jobName" th:field="*{jobName}" class="form-control" placeholder="Enter job name" required>
                <div class="instructions">Please provide the official job title.</div>
            </div>

            <!-- Job Description -->
            <div class="mb-4">
                <label for="jobDesc" class="form-label">Job Description</label>
                <textarea id="jobDesc" th:field="*{jobDesc}" class="form-control" rows="4" placeholder="Describe the job responsibilities" required></textarea>
                <div class="instructions">Include a detailed description of the tasks and expectations for the role.</div>
            </div>

            <!-- Company Name -->
            <div class="mb-4">
                <label class="form-label">Company Name</label>
                <input type="text" class="form-control" th:value="${company.getCompName()}" readonly>
                <input type="hidden" th:field="*{company.id}" th:value="${company.getId()}" />
            </div>

            <!-- Skills Section -->
            <div class="mb-4">
                <label class="form-label">Required Skills</label>
                <div th:each="skill, indexStart : ${skills}" class="mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <input class="form-check-input" type="checkbox" th:field="*{jobSkills[__${indexStart.index}__].skill}" th:value="${skill.id}" />
                            <label class="form-check-label" th:for="skillId" th:text="${skill.skillName}"></label>
                        </div>
                        <div class="d-flex align-items-center">
                            <label class="form-label mb-0 me-2">Skill Level:</label>
                            <select class="form-select" th:field="*{jobSkills[__${indexStart.index}__].skillLevel}" required>
                                <option th:each="type : ${T(vn.edu.iuh.fit.week05_nguyentanthaiduong_21049641.backend.enums.SkillLevel).values()}" th:value="${type}" th:text="${type}"></option>
                            </select>
                        </div>
                    </div>
                    <input type="text" id="moreInfo" th:field="*{jobSkills[__${indexStart.index}__].moreInfos}" class="form-control" placeholder="Additional information (optional)" />
                </div>
            </div>

            <!-- Add New Skills -->
            <div class="mb-4">
                <div id="newSkillsSection"></div>
                <button type="button" class="btn btn-outline-primary mt-3" id="add-new-skill">
                    Add Another Skill
                </button>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex justify-content-between mt-4">
                <a th:href="@{/company/jobs}" class="btn btn-outline-primary">
                    Back to Job List
                </a>
                <div>
                    <button type="reset" class="btn btn-outline-danger">
                        Reset
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Save Job
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('add-new-skill').addEventListener('click', function () {
        const newSkillsSection = document.getElementById('newSkillsSection');

        // Create a new skill entry div
        const newSkillEntry = document.createElement('div');
        newSkillEntry.classList.add('new-skill-entry');

        newSkillEntry.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <strong>New Skill</strong>
                    <button type="button" class="btn remove-skill">Remove</button>
                </div>
                <input type="text" class="form-control mb-2" name="newSkillNames" placeholder="Enter new skill name" required>
                <select class="form-select mb-2" name="newSkillLevels" required>
                    <option value="1">Beginner</option>
                    <option value="2">Intermediate</option>
                    <option value="3">Advanced</option>
                    <option value="4">Professional</option>
                    <option value="5">Master</option>
                </select>
                <input type="text" class="form-control" name="newSkillMoreInfos" placeholder="Enter more information (optional)">
            `;

        // Add the new skill entry to the section
        newSkillsSection.appendChild(newSkillEntry);
    });

    // Handle remove button
    document.getElementById('newSkillsSection').addEventListener('click', function (e) {
        if (e.target.classList.contains('remove-skill')) {
            const skillEntry = e.target.closest('.new-skill-entry');
            if (skillEntry) {
                skillEntry.remove();
            }
        }
    });
</script>

</body>

</html>
