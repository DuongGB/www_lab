<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: linear-gradient(to right, #00c6ff, #0072ff);
            font-family: 'Arial', sans-serif;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            width: 400px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        label {
            color: #343a40; /* Đảm bảo label có màu sắc hiển thị rõ ràng */
            font-weight: 500; /* Tăng độ đậm để dễ đọc hơn */
        }
        .btn-primary {
            background: #0072ff;
            border: none;
        }
        .btn-primary:hover {
            background: #0056cc;
        }
        a {
            color: #0072ff;
            text-decoration: none;
        }
        a:hover {
            color: #0056cc;
        }
    </style>
</head>
<body>
<div class="d-flex justify-content-center align-items-center" style="height: 100%;">
    <div>
        <div th:if="${error}" class="alert alert-danger text-center form-container mb-4">
            <p th:text="${error}"></p> <!-- Hiển thị thông báo lỗi nếu có -->
        </div>
        <div class="form-container">
            <h2 class="text-center mb-4">Đăng Nhập</h2>
            <form action="/login" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Nhập email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng Nhập</button>
            </form>
            <div class="text-center mt-3">
                <p>Chưa có tài khoản? <a href="/">Đăng ký</a></p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>
</html>
