<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/9631/9631363.png" type="image/x-icon">
  <title>Edit Job</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #F0F4F8; /* Light grayish blue */
      font-family: 'Arial', sans-serif;
      color: #3D3D3D; /* Dark gray for better contrast */
    }

    .container {
      max-width: 800px;
      margin-top: 50px;
    }

    .card {
      background-color: #fff;
      border: none;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      padding: 30px;
    }

    .card h1 {
      color: #4A90E2;
      font-weight: bold;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-label {
      font-weight: 600;
      color: #4A90E2;
    }

    .form-control, .form-select {
      border-radius: 8px;
      border: 1px solid #ccc;
      transition: border 0.3s ease-in-out;
    }

    .form-control:focus, .form-select:focus {
      border-color: #4A90E2;
      box-shadow: 0 0 10px rgba(74, 144, 226, 0.2);
    }

    .btn-primary {
      background-color: #4A90E2;
      color: #fff;
      border-radius: 30px;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #357ABD;
    }

    .btn-secondary {
      background-color: #F0F4F8;
      color: #4A90E2;
      border: 1px solid #4A90E2;
      border-radius: 30px;
      padding: 10px 20px;
      font-size: 16px;
      transition: background-color 0.3s, color 0.3s;
    }

    .btn-secondary:hover {
      background-color: #4A90E2;
      color: #fff;
    }

    .new-skill-entry {
      background-color: #E3F2FD;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .remove-skill {
      background-color: #FF6F61;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 50%;
      font-size: 14px;
      transition: background-color 0.3s ease;
    }

    .remove-skill:hover {
      background-color: #D84B3A;
    }

    .form-check-label {
      font-weight: 600;
      color: #333;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>Edit Job</h1>
    <form th:action="@{/jobs/{id}/edit(id=${job.id})}" th:object="${job}" method="post">

      <!-- Job Name -->
      <div class="mb-4">
        <label for="jobName" class="form-label">Job Name</label>
        <input type="text" id="jobName" th:field="*{jobName}" class="form-control" placeholder="Enter job name" required>
      </div>

      <!-- Job Description -->
      <div class="mb-4">
        <label for="jobDesc" class="form-label">Job Description</label>
        <textarea id="jobDesc" th:field="*{jobDesc}" class="form-control" rows="4" placeholder="Enter job description" required></textarea>
      </div>

      <!-- Company Name -->
      <div class="mb-4">
        <label class="form-label">Company Name</label>
        <p class="mb-1" th:text="${job.getCompany().getCompName()}"></p>
        <input type="hidden" th:field="*{company.id}" th:value="${job.getCompany().getId()}"/>
      </div>

      <!-- Skills Section -->
      <div class="mb-4">
        <label class="form-label">Required Skills</label>
        <div th:each="skill, indexStart : ${skills}">
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" th:field="*{jobSkills[__${indexStart.index}__].skill}" th:value="${skill.id}" th:checked="${#arrays.contains(job.jobSkills, skill)}"/>
            <label class="form-check-label" th:for="skillId" th:text="${skill.skillName}"></label>
          </div>

          <!-- Skill Level -->
          <div class="mb-3">
            <label class="form-label">Skill Level</label>
            <select class="form-select" th:field="*{jobSkills[__${indexStart.index}__].skillLevel}" required>
              <option th:each="type : ${T(vn.edu.iuh.fit.week05_nguyentanthaiduong_21049641.backend.enums.SkillLevel).values()}"
                      th:value="${type}" th:text="${type}"></option>
            </select>
          </div>

          <!-- More Info -->
          <div class="mb-3">
            <input type="text" class="form-control" th:field="*{jobSkills[__${indexStart.index}__].moreInfos}" placeholder="Enter more information">
          </div>
        </div>

        <div id="newSkillsSection"></div>
        <button type="button" class="btn btn-outline-primary mt-3" id="add-new-skill">
          <i class="bi bi-plus-circle"></i> Add Another Skill
        </button>
      </div>

      <!-- Buttons -->
      <div class="d-flex justify-content-between mt-4">
        <a th:href="@{/company/jobs}" class="btn btn-secondary">Back</a>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('add-new-skill').addEventListener('click', function () {
    const newSkillsSection = document.getElementById('newSkillsSection');

    const newSkillEntry = document.createElement('div');
    newSkillEntry.classList.add('new-skill-entry');

    newSkillEntry.innerHTML = `
            <div class="d-flex justify-content-between align-items-center mb-2">
                <strong>New Skill</strong>
                <button type="button" class="btn btn-sm btn-danger remove-skill">Remove</button>
            </div>
            <input type="text" class="form-control mb-2" name="newSkillNames" placeholder="Enter new skill name">
            <select class="form-select mb-2" name="newSkillLevels">
                <option value="1">Beginner</option>
                <option value="2">Intermediate</option>
                <option value="3">Advanced</option>
                <option value="4">Professional</option>
                <option value="5">Master</option>
            </select>
            <input type="text" class="form-control" name="newSkillMoreInfos" placeholder="Enter more information">
        `;

    newSkillsSection.appendChild(newSkillEntry);
  });

  document.getElementById('newSkillsSection').addEventListener('click', function (e) {
    if (e.target.classList.contains('remove-skill')) {
      const skillEntry = e.target.closest('.new-skill-entry');
      if (skillEntry) {
        skillEntry.remove();
      }
    }
  });
</script>
</body>
</html>
