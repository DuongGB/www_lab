<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/9631/9631363.png" type="image/x-icon">
    <title>Job Postings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f7f8fa;
        }
        .container {
            max-width: 1200px;
        }
        .header {
            background-color: #0072ff;
            color: white;
            padding: 15px 0;
        }
        .header h1 {
            margin: 0;
        }
        .card {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .btn-custom {
            background-color: #0072ff;
            color: white;
            border: none;
        }
        .btn-custom:hover {
            background-color: #0056cc;
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .table tbody tr:hover {
            background-color: #f1f1f1;
        }
        .btn-action {
            margin-right: 5px;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="header text-center mb-4">
        <h1>Welcome, <span th:text="${company.getCompName()}">Company</span></h1>
        <a th:href="@{/logout}" class="btn btn-danger">Logout</a>
    </div>
    <h2 class="mb-4">Job Postings</h2>
    <a href="/jobs/new" class="btn btn-custom mb-3">New Job Posting</a>
    <div class="card p-4">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Job Name</th>
                <th>Description</th>
                <th>Company</th>
                <th>Skills</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="jobPosting : ${jobPostings}">
                <td th:text="${jobPosting.getJobName()}"></td>
                <td th:text="${jobPosting.getJobDesc()}"></td>
                <td th:text="${jobPosting.company.getCompName()}"></td>
                <td>
                    <ul class="list-unstyled">
                        <li th:each="jobSkill : ${jobPosting.getJobSkills()}" th:text="${jobSkill.skill.getSkillName()}"></li>
                    </ul>
                </td>
                <td>
                    <a th:href="@{'/jobs/' + ${jobPosting.getId()} + '/invite'}" class="btn btn-custom btn-action">Find candidates</a>
                    <a href="/jobs/{jobPosting.getId()}/edit" class="btn btn-secondary btn-action">Edit</a>
                    <a href="/jobs/{jobPosting.getId()}/delete" class="btn btn-danger btn-action">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
