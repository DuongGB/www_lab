<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobs List with Pagination</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
          crossorigin="anonymous"></script>

  <style>
    .inline {
      color: black;
      float: left;
      padding: 5px;
      text-decoration: none;
      display: inline-block;
    }

    .inline a {
      text-decoration: none;
      padding: 8px;
    }

    .inline a.active {
      background-color: #FBD603;
      border: 1px solid darkred;
    }

    table th, table td {
      text-align: center;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <h1 class="text-center">LIST JOBS</h1>
  <!-- Back to Home Button -->
  <div class="row mb-4">
    <div class="col-auto">
      <a href="/" class="btn btn-primary">Back to Home</a>
    </div>
    <div class="col-auto">
      <a href="/add-company" class="btn btn-success">Add a new Company</a>
    </div>
  </div>

  <table class="table table-hover">
    <thead>
    <tr>
      <th>ID</th>
      <th>Company About</th>
      <th>Company Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Web URL</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="company, iStat : ${companyPage.content}"
        th:style="${iStat.odd} ? 'font-weight: bold;' : ''"
        th:alt-title="${iStat.even} ? 'even' : 'odd'">
      <td th:text="${company.id}"></td>
      <td th:text="${company.about}"></td>
      <td th:text="${company.compName}"></td>
      <td th:text="${company.email}"></td>
      <td th:text="${company.phone}"></td>
      <td th:text="${company.webUrl}"></td>
      <td>
        <a th:href="@{/edit/{id}(id=${company.id})}">Edit</a> |
        <a th:href="@{/delete/{id}(id=${company.id})}">Delete</a>
      </td>
    </tr>
    </tbody>
  </table>

  <div class="inline" th:if="${companyPage.totalPages > 0}" th:each="pageNumber : ${pageNumbers}">
    <a th:href="@{/companies(size=${companyPage.size}, page=${pageNumber})}"
       th:text="${pageNumber}"
       th:class="${pageNumber == companyPage.number + 1} ? 'active' : ''"></a>
  </div>

  <br/>

</div>

</body>
</html>
