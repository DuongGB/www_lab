<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Candidate Registration</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/9631/9631363.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(to bottom, #DAF4FF, #FFFFFF);
            font-family: 'Verdana', sans-serif;
        }
        .container {
            max-width: 900px;
            padding: 20px;
        }
        .header {
            background-color: #007ACC;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
        }
        .form-section {
            background-color: #FFFFFF;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-section h3 {
            color: #007ACC;
            margin-bottom: 15px;
        }
        .btn-primary {
            background-color: #007ACC;
            border: none;
        }
        .btn-primary:hover {
            background-color: #005F99;
        }
        .btn-secondary {
            background-color: #EEEEEE;
            border: none;
            color: #555;
        }
        .btn-secondary:hover {
            background-color: #CCCCCC;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Candidate Registration</h1>
    </div>

    <form th:action="@{/candidate/signUpCandidate}" method="post">
        <!-- Personal Details -->
        <div class="form-section">
            <h3>Personal Details</h3>
            <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" id="fullName" name="fullName" class="form-control" placeholder="Enter your full name" required>
            </div>
            <div class="mb-3">
                <label for="dob" class="form-label">Date of Birth</label>
                <input type="date" id="dob" name="dob" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="text" id="phone" name="phone" class="form-control" placeholder="Enter your phone number" required>
            </div>
        </div>

        <!-- Address Details -->
        <div class="form-section">
            <h3>Address</h3>
            <div class="mb-3">
                <label for="street" class="form-label">Street</label>
                <input type="text" id="street" name="address.street" class="form-control" placeholder="Enter street" required>
            </div>
            <div class="mb-3">
                <label for="number" class="form-label">Number</label>
                <input type="text" id="number" name="address.number" class="form-control" placeholder="Enter number" required>
            </div>
            <div class="mb-3">
                <label for="city" class="form-label">City</label>
                <input type="text" id="city" name="address.city" class="form-control" placeholder="Enter city" required>
            </div>
            <div class="mb-3">
                <label for="zipcode" class="form-label">Zip Code</label>
                <input type="text" id="zipcode" name="address.zipcode" class="form-control" placeholder="Enter zip code" required>
            </div>
            <div class="mb-3">
                <label for="country" class="form-label">Country</label>
                <select id="country" name="address.country" class="form-select" required>
                    <option value="" disabled selected>Select a country</option>
                    <option th:each="country : ${countries}" th:value="${country.alpha2}" th:text="${country.getName()}"></option>
                </select>
            </div>
        </div>

        <!-- Skills -->
        <div class="form-section">
            <h3>Skills</h3>
            <div class="mb-3">
                <label for="skill-1" class="form-label">Select a Skill</label>
                <select id="skill-1" name="skillIds" class="form-select">
                    <option value="" disabled selected>Select a skill</option>
                    <option th:each="skill : ${skills}" th:value="${skill.id}" th:text="${skill.skillName}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="skill-1-level" class="form-label">Skill Level</label>
                <select id="skill-1-level" name="skillLevels" class="form-select">
                    <option value="1">Beginner</option>
                    <option value="2">Intermediate</option>
                    <option value="3">Advanced</option>
                    <option value="4">Professional</option>
                    <option value="5">Master</option>
                </select>
            </div>
            <div id="newSkillsSection"></div>
            <button type="button" class="btn btn-secondary mt-2" id="add-new-skill">Add Another Skill</button>
        </div>

        <!-- Experiences -->
        <div class="form-section">
            <h3>Work Experiences</h3>
            <div id="experiences-section">
                <div class="mb-3">
                    <label for="experience-1-company" class="form-label">Company Name</label>
                    <input type="text" id="experience-1-company" name="experiences[0].companyName" class="form-control" placeholder="Enter company name">
                </div>
                <div class="mb-3">
                    <label for="experience-1-role" class="form-label">Role</label>
                    <input type="text" id="experience-1-role" name="experiences[0].role" class="form-control" placeholder="Enter role">
                </div>
                <div class="mb-3">
                    <label for="experience-1-fromDate" class="form-label">From Date</label>
                    <input type="date" id="experience-1-fromDate" name="experiences[0].fromDate" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="experience-1-toDate" class="form-label">To Date</label>
                    <input type="date" id="experience-1-toDate" name="experiences[0].toDate" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="experience-1-desc" class="form-label">Work Description</label>
                    <textarea id="experience-1-desc" name="experiences[0].workDescription" class="form-control" placeholder="Enter work description"></textarea>
                </div>
            </div>
            <button type="button" class="btn btn-secondary" id="add-experience">Add Experience</button>
        </div>

        <!-- Submit -->
        <div class="text-center">
            <button type="submit" class="btn btn-primary">Submit</button>
            <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
    let experienceCount = 1;

    document.getElementById('add-new-skill').addEventListener('click', function () {
        const newSkillsSection = document.getElementById('newSkillsSection');
        const newSkillEntry = document.createElement('div');
        newSkillEntry.classList.add('mb-3');
        newSkillEntry.innerHTML = `
            <label class="form-label">New Skill</label>
            <input type="text" class="form-control" name="newSkillNames" placeholder="Enter new skill name">
            <select class="form-select mt-2" name="newSkillLevels">
                <option value="1">Beginner</option>
                <option value="2">Intermediate</option>
                <option value="3">Advanced</option>
                <option value="4">Professional</option>
                <option value="5">Master</option>
            </select>
            <textarea class="form-control mt-2" name="newSkillMoreInfos" placeholder="Additional details"></textarea>
        `;
        newSkillsSection.appendChild(newSkillEntry);
    });

    document.getElementById('add-experience').addEventListener('click', function () {
        experienceCount++;
        const experiencesSection = document.getElementById('experiences-section');
        const newExperience = `
            <div class="mb-3">
                <label for="experience-${experienceCount}-company" class="form-label">Company Name</label>
                <input type="text" id="experience-${experienceCount}-company" name="experiences[${experienceCount - 1}].companyName" class="form-control" placeholder="Enter company name">
                <label for="experience-${experienceCount}-role" class="form-label mt-2">Role</label>
                <input type="text" id="experience-${experienceCount}-role" name="experiences[${experienceCount - 1}].role" class="form-control" placeholder="Enter role">
                <label for="experience-${experienceCount}-fromDate" class="form-label mt-2">From Date</label>
                <input type="date" id="experience-${experienceCount}-fromDate" name="experiences[${experienceCount - 1}].fromDate" class="form-control">
                <label for="experience-${experienceCount}-toDate" class="form-label mt-2">To Date</label>
                <input type="date" id="experience-${experienceCount}-toDate" name="experiences[${experienceCount - 1}].toDate" class="form-control">
                <label for="experience-${experienceCount}-desc" class="form-label mt-2">Work Description</label>
                <textarea id="experience-${experienceCount}-desc" name="experiences[${experienceCount - 1}].workDescription" class="form-control" placeholder="Enter work description"></textarea>
            </div>`;
        experiencesSection.insertAdjacentHTML('beforeend', newExperience);
    });
</script>
</body>
</html>
