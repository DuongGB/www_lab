<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Candidates with Pagination</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>

    <style>
        .inline {
            color: black;
            float: left;
            padding: 5px;
            text-decoration: none;
            display: inline-block;
        }

        .inline a {
            text-decoration: none;
            padding: 8px;
        }

        .inline a.active {
            background-color: #FBD603;
            border: 1px solid darkred;
        }

        table th, table td {
            text-align: center;
        }
        .light {
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <h1 class="text-center">LIST CANDIDATES</h1>
    <!-- Back to Home Button -->
    <div class="row mb-4 ">
        <div class="col-auto">
            <a href="/" class="btn btn-primary">Back to Home</a>
        </div>
        <div class="col-auto">
            <form method="get" action="/searchCandidateByFullName">
                <div class="input-group">
                    <input type="text" name="fullName" class="form-control" placeholder="Search by name"/>
                    <button type="submit" class="btn btn-info">Search</button>
                </div>
            </form>
        </div>
    </div>
    <table class="table table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Date of Birth</th>
            <th>Address</th>
            <th>Phone</th>
            <th>Email</th>
<!--            <th>Actions</th>-->
        </tr>
        </thead>
        <tbody>
        <tr th:each="candidate, iStat : ${candidatePage.content}"
            th:style="${iStat.odd} ? 'font-weight: bold;' : ''"
            th:alt-title="${iStat.even} ? 'even' : 'odd'">
            <td th:text="${candidate.id}"></td>
            <td th:text="${candidate.fullName}"></td>
            <td th:text="${candidate.dob}"></td>
            <td th:text="${candidate.address.getFullAddress}"></td>
            <td th:text="${candidate.phone}"></td>
            <td th:text="${candidate.email}"></td>
<!--            <td>-->
<!--                <button type="button" class="btn btn-success"><a class="light" th:href="@{/edit/{id}(id=${candidate.id})}">Edit</a></button> |-->
<!--                <button type="button" class="btn btn-danger"><a class="light" th:href="@{/delete/{id}(id=${candidate.id})}">Delete</a></button>-->
<!--            </td>-->
        </tr>
        </tbody>
    </table>

    <div class="inline" th:if="${candidatePage.totalPages > 0}" th:each="pageNumber : ${pageNumbers}">
        <a th:href="@{/candidates(size=${candidatePage.size}, page=${pageNumber})}"
           th:text="${pageNumber}"
           th:class="${pageNumber == candidatePage.number + 1} ? 'active' : ''"></a>
    </div>

    <br/>

</div>

</body>
</html>
