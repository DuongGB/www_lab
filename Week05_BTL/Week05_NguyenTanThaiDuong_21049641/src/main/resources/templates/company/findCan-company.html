<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invite Candidates</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/9631/9631363.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f9; /* Soft background for the entire page */
            font-family: 'Helvetica Neue', sans-serif;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin-top: 50px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h2 {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2C3E50; /* Darker shade of blue */
        }

        .header p {
            font-size: 1.1rem;
            color: #7f8c8d;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: none;
            background-color: #fff;
            margin-bottom: 20px;
        }

        .card-header {
            background-color: #1ABC9C; /* Teal background for the card header */
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .card-body {
            padding: 20px;
        }

        .table thead th {
            background-color: #34495E;
            color: white;
            font-size: 14px;
            text-align: center;
        }

        .table tbody tr:hover {
            background-color: #f1f1f1;
        }

        .btn-primary {
            background-color: #1ABC9C;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
        }

        .btn-primary:hover {
            background-color: #16A085;
        }

        .btn-secondary {
            border-radius: 20px;
            font-size: 14px;
            background-color: #7f8c8d;
            color: white;
            border: none;
        }

        .btn-secondary:hover {
            background-color: #95a5a6;
        }

        .empty-message {
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border: 1px solid #e1e1e1;
            border-radius: 8px;
            font-size: 1.1rem;
            color: #7f8c8d;
        }

        .badge-skill-level {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 5px;
            color: white;
        }

        .badge-skill-level.beginner {
            background-color: #BDC3C7;
        }

        .badge-skill-level.intermediate {
            background-color: #3498DB;
        }

        .badge-skill-level.advanced {
            background-color: #F39C12;
        }

        .badge-skill-level.professional {
            background-color: #2ECC71;
        }

        .badge-skill-level.master {
            background-color: #E74C3C;
        }

        .experience-item {
            margin-bottom: 15px;
            padding: 12px;
            background-color: #ecf0f1;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .experience-header {
            font-weight: bold;
            color: #2C3E50;
        }

        .back-button {
            text-align: center;
            margin-top: 30px;
        }

        .alert {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="header">
        <h2>FIND CANDIDATES FOR JOB: <span th:text="${job.getJobName().toUpperCase()}"></span></h2>
        <p>Job Description: <span th:text="${job.getJobDesc()}"></span></p>
    </div>

    <div th:if="${!#lists.isEmpty(candidates)}">
        <h3 class="mb-3 text-primary">Suitable Candidates</h3>
        <div class="card">
            <div class="card-header">
                Candidate List
            </div>
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Candidate Name</th>
                        <th>Email</th>
                        <th>Skills & Levels</th>
                        <th>Experience</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="candidate : ${candidates}">
                        <td th:text="${candidate.getFullName()}"></td>
                        <td th:text="${candidate.getEmail()}"></td>
                        <td>
                            <div th:each="skill : ${candidate.candidateSkills}" class="skill-item">
                                <span th:text="${skill.getSkill().getSkillName()}"></span>
                                <span th:classappend="${skill.getSkillLevel() == 1 ? 'badge-skill-level beginner' :
                          skill.getSkillLevel() == 2 ? 'badge-skill-level intermediate' :
                          skill.getSkillLevel() == 3 ? 'badge-skill-level advanced' :
                          skill.getSkillLevel() == 4 ? 'badge-skill-level professional' :
                          skill.getSkillLevel() == 5 ? 'badge-skill-level master' : 'badge-skill-level unknown'}">
                                    <span th:text="${skill.getSkillLevel() == 1 ? 'BEGINNER' : skill.getSkillLevel() == 2 ? 'INTERMEDIATE' : skill.getSkillLevel() == 3 ? 'ADVANCED' : skill.getSkillLevel() == 4 ? 'PROFESSIONAL' : skill.getSkillLevel() == 5 ? 'MASTER' : 'UNKNOWN'}"></span>
                                </span>
                            </div>
                        </td>
                        <td>
                            <div th:each="exp : ${candidate.experiences}" class="experience-item">
                                <div>
                                    <span class="experience-header">Company:</span>
                                    <span th:text="${exp.company}"></span>
                                </div>
                                <div>
                                    <span class="experience-header">Position:</span>
                                    <span th:text="${exp.getRole()}"></span>
                                </div>
                                <div>
                                    <span class="experience-header">Duration:</span>
                                    <span th:text="${exp.getFromDate()} + ' - ' + (${exp.getToDate()} != null ? ${exp.getToDate()} : 'Present')"></span>
                                </div>
                            </div>
                        </td>
                        <td>
                            <form th:action="@{'/jobs/' + ${job.getId()} + '/invite/' + ${candidate.getId()}}" method="post">
                                <button type="submit" class="btn btn-primary">Invite</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(candidates)}" class="empty-message">
        <h5 class="text-muted">No suitable candidates found for this job.</h5>
    </div>

    <div class="back-button">
        <a th:href="@{/company/jobs}" class="btn btn-secondary">Back to Job Listings</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
