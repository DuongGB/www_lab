<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Candidate Job Recommendations</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/9631/9631363.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f5f7;
            font-family: 'Arial', sans-serif;
            color: #333;
        }
        .navbar {
            background-color: #1b3a57;
            padding: 15px;
        }
        .navbar-brand {
            font-weight: bold;
            color: #fff;
        }
        .navbar .btn {
            border-radius: 25px;
            font-size: 0.9rem;
        }
        .btn-primary {
            background-color: #4CAF50;
            border: none;
        }
        .btn-primary:hover {
            background-color: #3b9142;
        }
        .btn-secondary {
            background-color: #556080;
            border: none;
        }
        .btn-secondary:hover {
            background-color: #3a4c62;
        }
        .dropdown-menu {
            border-radius: 10px;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 10px;
            transition: box-shadow 0.3s;
            overflow: hidden;
            background-color: #fff;
        }
        .card:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        .card h5 {
            font-weight: bold;
            color: #1b3a57;
        }
        .alert {
            border-radius: 10px;
        }
        footer {
            text-align: center;
            padding: 15px;
            background-color: #1b3a57;
            color: #fff;
            margin-top: 30px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Job Portal</a>
        <div class="d-flex align-items-center">
            <a class="btn btn-primary me-3"
               href="/jobs/list-job">
                List Jobs
            </a>
            <a class="btn btn-primary me-3"
               th:href="@{/skills/recommend/{candidateId}(candidateId=${candidate.id})}">
                Skill Recommendations
            </a>
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Welcome, <span th:text="${candidate.fullName}">Candidate</span>
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" th:href="@{/candidate/edit/{id}(id=${candidate.id})}">Edit Profile</a></li>
                    <li><a class="dropdown-item" th:href="@{/logout}">Logout</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div th:if="${successMessage}" class="alert alert-success text-center">
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger text-center">
        <span th:text="${errorMessage}"></span>
    </div>

    <h3 class="text-center mb-4">Job Recommendations</h3>

    <div th:if="${#lists.isEmpty(jobs)}" class="alert alert-warning text-center">
        No job recommendations found.
    </div>

    <div th:if="${!#lists.isEmpty(jobs)}" class="row g-4">
        <div th:each="job : ${jobs}" class="col-lg-4 col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 th:text="${job.getJobName()}"></h5>
                    <p th:text="${job.getJobDesc()}"></p>
                    <p><strong>Company:</strong> <span th:text="${job.getCompany().getCompName()}"></span></p>
                    <a class="btn btn-primary mt-2" th:href="@{/jobs/detail/{id}(id=${job.getId()})}">View Details</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer>
    &copy; 2024 Job Portal. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
